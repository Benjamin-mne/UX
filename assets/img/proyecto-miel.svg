  <title id="title">Wireframe genérico de la Landing Page Miel</title>
  <desc id="desc">Boceto de baja fidelidad basado en la landing publicada de La Sanjosesina: navegación fija, hero con video, seis fichas de producto, historia con slider, formulario de contacto y acceso flotante a WhatsApp.</desc>
