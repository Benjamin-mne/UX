<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio19</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <input type="radio" name="step-control" id="step1-trigger" checked class="step-radio">
        <input type="radio" name="step-control" id="step2-trigger" class="step-radio">

        <div class="progress-bar">
            <div class="progress-step step-1">Paso 1</div>
            <div class="progress-step step-2">Paso 2</div>
        </div>

        <form class="multi-step-form" novalidate>
            
            <section class="form-step" id="step1-content">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required>
                    <span class="error-message">Introduce un correo electrónico válido.</span>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required minlength="6">
                    <span class="error-message">La contraseña debe tener al menos 6 caracteres.</span>
                </div>

                <div class="form-buttons">
                    <label for="step2-trigger" class="btn btn-next">Siguiente</label>
                </div>
            </section>

            <section class="form-step" id="step2-content">
                <div class="input-group">
                    <label for="fullname">Nombre Completo</label>
                    <input type="text" id="fullname" required pattern="[a-zA-Z\s]{3,}">
                    <span class="error-message">Ingresa un nombre válido (solo letras, mínimo 3).</span>
                </div>

                <div class="input-group">
                    <label for="phone">Teléfono (Opcional)</label>
                    <input type="tel" id="phone" pattern="[0-9]{9,}">
                    <span class="error-message">Formato de teléfono incorrecto (solo números).</span>
                </div>

                <div class="form-buttons">
                    <label for="step1-trigger" class="btn btn-back">Atrás</label>
                    <button type="submit" class="btn btn-submit">Registrarse</button>
                </div>
            </section>
        </form>
    </div>
</body>
</html>
